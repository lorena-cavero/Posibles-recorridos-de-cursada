<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posibles recorridos para regularizar o promocionar la asignatura · Simulador de Decisión</title>
<style>
  :root {
    --bg: #FBF9F5;
    --card: #FFFFFF;
    --ink: #2A2421;
    --muted: #655B54;
    --terracotta: #B85233;
    --terracotta-dark: #963E23;
    --terracotta-light: #F7EBE7;
    --forest: #4F6838;
    --forest-dark: #3B4F29;
    --forest-light: #ECF2E6;
    --border: #E2DBD0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 14px 48px;
    background-color: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.6;
  }
  .container { max-width: 760px; margin: 0 auto; }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .header-title { font-weight: 800; font-size: 17px; color: var(--ink); }
  .header-role { font-size: 14px; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(42, 36, 33, 0.06);
  }
  .visual-box {
    width: 100%;
    background: #F3EFE6;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .visual-box svg { width: 100%; height: auto; display: block; }
  .visual-box img { max-width: 100%; max-height: 380px; object-fit: contain; display: block; }
  .content { padding: 26px 24px 30px; }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }
  .badge-decision { background: var(--terracotta-light); color: var(--terracotta); }
  .badge-final { background: var(--forest-light); color: var(--forest); }
  h1, h2, h3 { margin: 0 0 12px; line-height: 1.25; }
  .situation-text { font-size: 20px; margin: 0 0 24px; color: var(--ink); }
  .options-list { display: flex; flex-direction: column; gap: 14px; }
  .option-btn {
    width: 100%;
    text-align: left;
    background: var(--terracotta);
    color: #FFFFFF;
    border: none;
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.45;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: background 0.15s, transform 0.1s;
  }
  .option-btn:hover { background: var(--terracotta-dark); }
  .option-btn:active { transform: scale(0.99); }
  .opt-letter {
    background: rgba(255,255,255,0.22);
    padding: 2px 11px;
    border-radius: 8px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .login-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin: 18px 0 24px;
  }
  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 17px;
    border: 1px solid #C9BFB5;
    border-radius: 12px;
    margin-bottom: 14px;
    background: #FFFFFF;
  }
  .submit-sheet-box {
    background: var(--forest);
    color: #FFFFFF;
    border-radius: 18px;
    padding: 22px;
    margin: 22px 0;
  }
  .submit-sheet-btn {
    width: 100%;
    background: #FFFFFF;
    color: var(--forest-dark);
    border: none;
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 12px;
  }
  .submit-sheet-btn:disabled { opacity: 0.75; cursor: default; }
  .closing-box {
    background: var(--forest-light);
    border: 1px solid #C3D4B4;
    border-radius: 16px;
    padding: 18px 20px;
    margin: 20px 0;
  }
  .vars-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px;
    margin: 16px 0 24px;
  }
  .var-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }
  .bar-bg {
    width: 100%;
    height: 10px;
    background: #DFD9CE;
    border-radius: 99px;
    overflow: hidden;
    margin-top: 8px;
  }
  .bar-fill { height: 100%; background: var(--forest); border-radius: 99px; }
  .step-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 16px;
  }
  .code-box {
    background: #2A2421;
    color: #FFFFFF;
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
  }
  .secondary-btn {
    background: #3E3632;
    color: #FFFFFF;
    border: 1px solid #594E49;
    padding: 9px 15px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .msg-banner {
    display: none;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 700;
    background: var(--terracotta-light);
    color: var(--terracotta-dark);
  }
</style>
</head>

<div class="container">

    <div>
      <div class="header-title" id="sim-title"></div>

    </div>
    <button class="secondary-btn" onclick="restartSim()">Reiniciar</button>
  </div>
  <div class="card" id="sim-screen"></div>
</div>

      "closingComment": "",

      "visualContent": "\u003csvg viewBox=\"0 0 800 420\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\n  \u003cdefs\u003e\n    \u003c!-- Gradientes generales --\u003e\n    \u003clinearGradient id=\"bgGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#fdfbf7\"/\u003e\n      \u003cstop offset=\"50%\" stop-color=\"#f4efe6\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#e9e1d4\"/\u003e\n    \u003c/linearGradient\u003e\n    \n    \u003clinearGradient id=\"boardGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#1b3a2b\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#0f2319\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003clinearGradient id=\"pathGrad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#3b82f6\"/\u003e\n      \u003cstop offset=\"50%\" stop-color=\"#8b5cf6\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#f59e0b\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003clinearGradient id=\"cardGrad\" x1=\"0%\" y1=\"0%\" x2=\"0%\" y2=\"100%\"\u003e\n      \u003cstop offset=\"0%\" stop-color=\"#ffffff\"/\u003e\n      \u003cstop offset=\"100%\" stop-color=\"#fcfbfa\"/\u003e\n    \u003c/linearGradient\u003e\n\n    \u003c!-- Sutiles sombras --\u003e\n    \u003cfilter id=\"shadow\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"110%\"\u003e\n      \u003cfeDropShadow dx=\"2\" dy=\"4\" stdDeviation=\"4\" flood-color=\"#000000\" flood-opacity=\"0.08\"/\u003e\n    \u003c/filter\u003e\n    \u003cfilter id=\"glow\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"\u003e\n      \u003cfeDropShadow dx=\"0\" dy=\"0\" stdDeviation=\"6\" flood-color=\"#f59e0b\" flood-opacity=\"0.3\"/\u003e\n    \u003c/filter\u003e\n  \u003c/defs\u003e\n\n  \u003c!-- Fondo general estilo editorial académico --\u003e\n  \u003crect width=\"800\" height=\"420\" fill=\"url(#bgGrad)\"/\u003e\n  \n  \u003c!-- Patrón de fondo geométrico sutil (cuadrícula matemática) --\u003e\n  \u003cg stroke=\"#e2d9cc\" stroke-width=\"0.8\" opacity=\"0.6\"\u003e\n    \u003cpath d=\"M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800\" /\u003e\n    \u003cpath d=\"M100 0 V420 M200 0 V420 M300 0 V420 M400 0 V420 M500 0 V420 M600 0 V420 M700 0 V420\" /\u003e\n  \u003c/g\u003e\n\n  \u003c!-- PARRALEX / AMBIENTE DE FONDO: Pizarrones con fórmulas e integrales --\u003e\n  \u003cg transform=\"translate(480, 25)\" filter=\"url(#shadow)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"280\" height=\"135\" rx=\"6\" fill=\"url(#boardGrad)\" stroke=\"#2d3748\" stroke-width=\"3\"/\u003e\n    \u003c!-- Fórmulas escritas con tiza --\u003e\n    \u003ctext x=\"20\" y=\"35\" font-family=\"Courier New, monospace\" font-size=\"14\" fill=\"#a7f3d0\"\u003e$\\int_0^{t_2} f(x)\\,dx = \\text{Área Total}$\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"65\" font-family=\"Courier New, monospace\" font-size=\"13\" fill=\"#e2e8f0\"\u003e$\\lim_{x \\to c} \\frac{df}{dx} \\implies \\text{Integración}$\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"95\" font-family=\"Courier New, monospace\" font-size=\"12\" fill=\"#93c5fd\"\u003eN4: Instancia Segundo Parcial\u003c/text\u003e\n    \u003cpath d=\"M20 110 L260 110\" stroke=\"#334155\" stroke-dasharray=\"4 4\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- CONTENEDOR PRINCIPAL: NODO N4 (ESTILO TARJETA CENTRAL) --\u003e\n  \u003cg transform=\"translate(40, 60)\" filter=\"url(#shadow)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"420\" height=\"330\" rx=\"12\" fill=\"url(#cardGrad)\" stroke=\"#d1c7bd\" stroke-width=\"1.5\"/\u003e\n    \n    \u003c!-- Barra superior de la tarjeta (Indicador de Nodo) --\u003e\n    \u003cpath d=\"M 12 0 L 408 0 Q 420 0 420 12 L 420 40 L 0 40 L 0 12 Q 0 0 12 0 Z\" fill=\"#1e293b\"/\u003e\n    \u003ctext x=\"20\" y=\"25\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#f8fafc\" letter-spacing=\"1\"\u003eNODO N4 • INSTANCIA SEGUNDO PARCIAL\u003c/text\u003e\n    \n    \u003c!-- Contenido de texto descriptivo --\u003e\n    \u003cg transform=\"translate(25, 60)\"\u003e\n      \u003c!-- Indicador visual destacado \"Mitad de camino\" --\u003e\n      \u003cg transform=\"translate(0, 0)\"\u003e\n        \u003crect x=\"0\" y=\"0\" width=\"370\" height=\"32\" rx=\"6\" fill=\"#eff6ff\" stroke=\"#bfdbfe\" stroke-width=\"1\"/\u003e\n        \u003ccircle cx=\"16\" cy=\"16\" r=\"8\" fill=\"#3b82f6\"/\u003e\n        \u003ctext x=\"32\" y=\"22\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#1d4ed8\"\u003e¡Ya superaste la mitad del cuatrimestre!\u003c/text\u003e\n      \u003c/g\u003e\n\n      \u003c!-- Descripción del caso --\u003e\n      \u003cforeignObject x=\"0\" y=\"45\" width=\"370\" height=\"150\"\u003e\n        \u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family: system-ui, -apple-system, sans-serif; font-size: 14px; color: #334155; line-height: 1.6;\"\u003e\n          Te encontrás ante el \u003cstrong\u003esegundo parcial\u003c/strong\u003e y la necesidad imperiosa de integrar los conceptos teóricos y prácticos acumulados hasta aquí. Es el puente definitivo hacia la promoción o la regularidad.\n        \u003c/div\u003e\n      \u003c/foreignObject\u003e\n    \u003c/g\u003e\n  \u003c/g\u003e\n\n  \u003c!-- ILUSTRACIÓN CONCEPTUAL: \"LA MITAD DEL CAMINO / SEGUNDO PARCIAL\" --\u003e\n  \u003cg transform=\"translate(480, 175)\" filter=\"url(#shadow)\"\u003e\n    \u003c!-- Base de la tarjeta gráfica --\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"280\" height=\"215\" rx=\"12\" fill=\"#ffffff\" stroke=\"#d1c7bd\" stroke-width=\"1.5\"/\u003e\n    \n    \u003c!-- Mapa conceptual interno: Línea de tiempo / Recorrido con Hitos --\u003e\n    \u003cg transform=\"translate(30, 40)\"\u003e\n      \u003c!-- Camino base --\u003e\n      \u003cpath d=\"M 20 70 Q 110 10 200 70\" fill=\"none\" stroke=\"#e2e8f0\" stroke-width=\"6\" stroke-linecap=\"round\"/\u003e\n      \u003c!-- Camino recorrido (Mitad) --\u003e\n      \u003cpath d=\"M 20 70 Q 65 40 110 45\" fill=\"none\" stroke=\"url(#pathGrad)\" stroke-width=\"6\" stroke-linecap=\"round\" filter=\"url(#glow)\"/\u003e\n      \n      \u003c!-- Hito 1: Primer Parcial (Superado) --\u003e\n      \u003cg transform=\"translate(20, 70)\"\u003e\n        \u003ccircle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#10b981\"/\u003e\n        \u003ctext x=\"0\" y=\"4\" font-family=\"system-ui, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\"\u003e✓\u003c/text\u003e\n        \u003ctext x=\"0\" y=\"22\" font-family=\"system-ui, sans-serif\" font-size=\"10\" font-weight=\"600\" fill=\"#047857\" text-anchor=\"middle\"\u003e1° Parcial\u003c/text\u003e\n      \u003c/g\u003e\n\n      \u003c!-- Hito 2: Instancia Actual (N4 - Segundo Parcial) --\u003e\n      \u003cg transform=\"translate(110, 45)\"\u003e\n        \u003ccircle cx=\"0\" cy=\"0\" r=\"14\" fill=\"#f59e0b\" filter=\"url(#glow)\"/\u003e\n        \u003ccircle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#ffffff\"/\u003e\n        \u003ctext x=\"0\" y=\"28\" font-family=\"system-ui, sans-serif\" font-size=\"11\" font-weight=\"800\" fill=\"#b45309\" text-anchor=\"middle\"\u003e2° PARCIAL\u003c/text\u003e\n        \u003ctext x=\"0\" y=\"42\" font-family=\"system-ui, sans-serif\" font-size=\"9\" font-weight=\"600\" fill=\"#78350f\" text-anchor=\"middle\"\u003e(Estás aquí)\u003c/text\u003e\n      \u003c/g\u003e\n\n      \u003c!-- Hito 3: Promoción / Regularidad (Meta final) --\u003e\n      \u003cg transform=\"translate(200, 70)\"\u003e\n        \u003ccircle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#cbd5e1\"/\u003e\n        \u003ctext x=\"0\" y=\"22\" font-family=\"system-ui, sans-serif\" font-size=\"10\" font-weight=\"600\" fill=\"#64748b\" text-anchor=\"middle\"\u003eMeta Final\u003c/text\u003e\n      \u003c/g\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Leyenda inferior destacada dentro de la tarjeta gráfica --\u003e\n    \u003cg transform=\"translate(15, 160)\"\u003e\n      \u003crect x=\"0\" y=\"0\" width=\"250\" height=\"40\" rx=\"6\" fill=\"#fffbeb\" stroke=\"#fde68a\" stroke-width=\"1\"/\u003e\n      \u003ctext x=\"125\" y=\"18\" font-family=\"Georgia, serif\" font-size=\"11\" font-style=\"italic\" font-weight=\"700\" fill=\"#92400e\" text-anchor=\"middle\"\u003e\"Hay que enfrentar el segundo parcial\"\u003c/text\u003e\n      \u003ctext x=\"125\" y=\"31\" font-family=\"system-ui, sans-serif\" font-size=\"9\" font-weight=\"600\" fill=\"#b45309\" text-anchor=\"middle\"\u003eIntegración de teoría y práctica\u003c/text\u003e\n    \u003c/g\u003e\n  \u003c/g\u003e\n\n\u003c/svg\u003e",

      "visualType": "svg",
      "visualContent": "\u003csvg viewBox=\"0 0 800 420\" xmlns=\"http://www.w3.org/2000/svg\"\u003e\n  \u003cdefs\u003e\n    \u003c!-- Estilos generales y fuentes --\u003e\n    \u003cstyle\u003e\n      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap');\n      .bg { fill: #fdfbf7; }\n      .wall { fill: #f4eee1; }\n      .floor { fill: #e6dec5; }\n      .chalkboard { fill: #2c3e35; }\n      .wood { fill: #b87a4d; }\n      .text-main { font-family: 'Inter', sans-serif; fill: #2c3e50; }\n      .text-title { font-family: 'Inter', sans-serif; font-weight: 800; fill: #1e293b; }\n      .text-bold { font-weight: 700; }\n      .text-muted { fill: #64748b; font-size: 11px; }\n      .card { fill: #ffffff; filter: drop-shadow(0px 8px 24px rgba(0,0,0,0.08)); rx: 16px; }\n      .confetti { opacity: 0.85; }\n    \u003c/style\u003e\n\n    \u003c!-- Patrón sutil para el piso --\u003e\n    \u003cpattern id=\"floor-grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\"\u003e\n      \u003cpath d=\"M 40 0 L 0 0 0 40\" fill=\"none\" stroke=\"#ddd6c1\" stroke-width=\"1\"/\u003e\n    \u003c/pattern\u003e\n\n    \u003c!-- Sombras --\u003e\n    \u003cfilter id=\"shadow\" x=\"-10%\" y=\"-10%\" width=\"120%\" height=\"120%\"\u003e\n      \u003cfeDropShadow dx=\"0\" dy=\"4\" stdDeviation=\"6\" flood-opacity=\"0.08\"/\u003e\n    \u003c/filter\u003e\n  \u003c/defs\u003e\n\n  \u003c!-- Fondo general --\u003e\n  \u003crect width=\"800\" height=\"420\" class=\"bg\"/\u003e\n\n  \u003c!-- Pared del aula universitaria --\u003e\n  \u003crect x=\"0\" y=\"0\" width=\"800\" height=\"310\" class=\"wall\"/\u003e\n  \u003cline x1=\"0\" y1=\"310\" x2=\"800\" y2=\"310\" stroke=\"#d4cbaf\" stroke-width=\"3\"/\u003e\n\n  \u003c!-- Piso --\u003e\n  \u003crect x=\"0\" y=\"310\" width=\"800\" height=\"110\" class=\"floor\"/\u003e\n  \u003crect x=\"0\" y=\"310\" width=\"800\" height=\"110\" fill=\"url(#floor-grid)\"/\u003e\n\n  \u003c!-- Ventana al fondo con luz natural --\u003e\n  \u003cg transform=\"translate(60, 40)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"90\" height=\"180\" fill=\"#e2edea\" stroke=\"#d1dedb\" stroke-width=\"4\" rx=\"4\"/\u003e\n    \u003cline x1=\"45\" y1=\"0\" x2=\"45\" y2=\"180\" stroke=\"#d1dedb\" stroke-width=\"3\"/\u003e\n    \u003cline x1=\"0\" y1=\"90\" x2=\"90\" y2=\"90\" stroke=\"#d1dedb\" stroke-width=\"3\"/\u003e\n    \u003c!-- Luz entrando --\u003e\n    \u003cpolygon points=\"45,90 90,180 0,180\" fill=\"#ffffff\" opacity=\"0.3\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Pizarrón de fondo con fórmulas de Cálculo I (UNLPam) --\u003e\n  \u003cg transform=\"translate(180, 30)\"\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"300\" height=\"170\" class=\"chalkboard\" rx=\"4\"/\u003e\n    \u003crect x=\"-6\" y=\"-6\" width=\"312\" height=\"182\" fill=\"none\" stroke=\"#8b5a2b\" stroke-width=\"6\" rx=\"8\"/\u003e\n    \n    \u003c!-- Fórmulas matemáticas tizas blancas y suaves --\u003e\n    \u003ctext x=\"20\" y=\"30\" fill=\"#e2e8f0\" font-family=\"monospace\" font-size=\"13\"\u003e$$\\int_{a}^{b} f(x)dx = F(b) - F(a)$$\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"60\" fill=\"#94a3b8\" font-family=\"monospace\" font-size=\"12\"\u003e$$\\lim_{x \\to 0} \\frac{\\sin(x)}{x} = 1$$\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"90\" fill=\"#e2e8f0\" font-family=\"monospace\" font-size=\"12\"\u003e$$\\frac{d}{dx}(e^{x^2}) = 2x e^{x^2}$$\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"125\" fill=\"#34d399\" font-family=\"monospace\" font-size=\"11\"\u003eFacultad de Cs. Exactas y Naturales\u003c/text\u003e\n    \u003ctext x=\"20\" y=\"145\" fill=\"#94a3b8\" font-family=\"monospace\" font-size=\"11\"\u003eCálculo I - UNLPam\u003c/text\u003e\n    \n    \u003c!-- Pequeño gráfico de función en pizarra --\u003e\n    \u003cpath d=\"M 210,120 Q 230,70 260,90 T 290,50\" fill=\"none\" stroke=\"#f43f5e\" stroke-width=\"2\"/\u003e\n    \u003cline x1=\"205\" y1=\"130\" x2=\"295\" y2=\"130\" stroke=\"#64748b\" stroke-width=\"1\"/\u003e\n    \u003cline x1=\"210\" y1=\"50\" x2=\"210\" y2=\"135\" stroke=\"#64748b\" stroke-width=\"1\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- Estantería / Libros al fondo --\u003e\n  \u003cg transform=\"translate(500, 70)\"\u003e\n    \u003crect x=\"0\" y=\"90\" width=\"120\" height=\"10\" class=\"wood\" rx=\"2\"/\u003e\n    \u003c!-- Libros de Exactas --\u003e\n    \u003crect x=\"15\" y=\"45\" width=\"15\" height=\"45\" fill=\"#3b82f6\" rx=\"1\"/\u003e\n    \u003crect x=\"32\" y=\"40\" width=\"18\" height=\"50\" fill=\"#ef4444\" rx=\"1\"/\u003e\n    \u003crect x=\"52\" y=\"55\" width=\"12\" height=\"35\" fill=\"#10b981\" rx=\"1\"/\u003e\n    \u003crect x=\"66\" y=\"35\" width=\"22\" height=\"55\" fill=\"#8b5cf6\" rx=\"1\"/\u003e\n    \u003crect x=\"90\" y=\"50\" width=\"16\" height=\"40\" fill=\"#f59e0b\" rx=\"1\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- CONFETTI Y ELEMENTOS FESTIVOS --\u003e\n  \u003cg class=\"confetti\"\u003e\n    \u003ccircle cx=\"120\" cy=\"100\" r=\"4\" fill=\"#f43f5e\"/\u003e\n    \u003crect x=\"150\" y=\"140\" width=\"8\" height=\"5\" fill=\"#3b82f6\" transform=\"rotate(25 154 142.5)\"/\u003e\n    \u003ccircle cx=\"280\" cy=\"80\" r=\"3\" fill=\"#10b981\"/\u003e\n    \u003cpolygon points=\"580,50 585,60 575,60\" fill=\"#f59e0b\"/\u003e\n    \u003crect x=\"620\" y=\"120\" width=\"6\" height=\"10\" fill=\"#ec4899\" transform=\"rotate(-15 623 125)\"/\u003e\n    \u003ccircle cx=\"670\" cy=\"80\" r=\"5\" fill=\"#3b82f6\"/\u003e\n    \u003crect x=\"710\" y=\"150\" width=\"8\" height=\"6\" fill=\"#10b981\" transform=\"rotate(40 714 153)\"/\u003e\n    \u003cpolygon points=\"100,200 105,210 95,210\" fill=\"#8b5cf6\"/\u003e\n  \u003c/g\u003e\n\n  \u003c!-- TARJETA INFORMATIVA / NODO F1 --\u003e\n  \u003cg transform=\"translate(135, 85)\"\u003e\n    \u003c!-- Tarjeta de fondo principal --\u003e\n    \u003crect x=\"0\" y=\"0\" width=\"530\" height=\"250\" class=\"card\" filter=\"url(#shadow)\"/\u003e\n    \n    \u003c!-- Barra superior de estado / acento --\u003e\n    \u003cpath d=\"M 16 0 L 514 0 A 16 16 0 0 1 530 16 L 530 8 L 0 8 L 0 16 A 16 16 0 0 1 16 0 Z\" fill=\"#10b981\"/\u003e\n\n    \u003c!-- Icono de éxito / medalla --\u003e\n    \u003cg transform=\"translate(30, 30)\"\u003e\n      \u003ccircle cx=\"24\" cy=\"24\" r=\"24\" fill=\"#d1fae5\"/\u003e\n      \u003c!-- Checkmark vectorial --\u003e\n      \u003cpath d=\"M 15 24 L 21 30 L 33 16\" fill=\"none\" stroke=\"#059669\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Título de la tarjeta modificado --\u003e\n    \u003ctext x=\"95\" y=\"48\" class=\"text-title\" font-size=\"20\"\u003e¡PROMOCIONASTE!\u003c/text\u003e\n    \n    \u003c!-- Badge de Asignatura --\u003e\n    \u003cg transform=\"translate(370, 28)\"\u003e\n      \u003crect x=\"0\" y=\"0\" width=\"130\" height=\"26\" fill=\"#f1f5f9\" rx=\"6\"/\u003e\n      \u003ctext x=\"65\" y=\"17\" text-anchor=\"middle\" class=\"text-main text-bold\" font-size=\"10\" fill=\"#475569\"\u003eCÁLCULO I • UNLPam\u003c/text\u003e\n    \u003c/g\u003e\n\n    \u003c!-- Línea divisoria sutil --\u003e\n    \u003cline x1=\"30\" y1=\"85\" x2=\"500\" y2=\"85\" stroke=\"#f1f5f9\" stroke-width=\"2\"/\u003e\n\n    \u003c!-- Texto descriptivo (Feedback educativo/institucional) --\u003e\n    \u003cforeignObject x=\"30\" y=\"100\" width=\"470\" height=\"100\"\u003e\n      \u003cdiv xmlns=\"http://www.w3.org/1999/xhtml\" style=\"font-family: 'Inter', sans-serif; color: #334155; font-size: 14px; line-height: 1.6;\"\u003e\n        Lograste alcanzar todos los \u003cspan style=\"color: #059669; font-weight: 700;\"\u003erequisitos teóricos y prácticos\u003c/span\u003e. Además del porcentaje de asistencia y de aprobar el \u003cspan style=\"color: #1e293b; font-weight: 700;\"\u003eTrabajo Integrador\u003c/span\u003e. \n        \u003cdiv style=\"margin-top: 8px; font-weight: 600; color: #047857;\"\u003e\n          ¡Muy bien! Has finalizado la cursada con éxito total.\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/foreignObject\u003e\n\n    \u003c!-- Pie de tarjeta con indicador de estado --\u003e\n    \u003cg transform=\"translate(30, 205)\"\u003e\n      \u003crect x=\"0\" y=\"0\" width=\"160\" height=\"26\" fill=\"#ecfdf5\" rx=\"6\"/\u003e\n      \u003ccircle cx=\"12\" cy=\"13\" r=\"4\" fill=\"#10b981\"/\u003e\n      \u003ctext x=\"24\" y=\"17\" class=\"text-main text-bold\" font-size=\"11\" fill=\"#047857\"\u003eEstado: Eximido/a de Final\u003c/text\u003e\n    \u003c/g\u003e\n\n    \u003ctext x=\"500\" y=\"222\" text-anchor=\"end\" class=\"text-muted\"\u003eFacultad de Ciencias Exactas y Naturales\u003c/text\u003e\n  \u003c/g\u003e\n\u003c/svg\u003e",

let state = {
  registered: !DATOS_SIMULADOR.requireLogin,
  studentName: '',
  studentId: '',
  submitted: false,
  currentNodeId: DATOS_SIMULADOR.nodes[0].id,
  vars: {},
  history: [],
  pendingConsequence: null
};

function initVars() {
  const v = {};
  DATOS_SIMULADOR.variables.forEach(item => {
    if (item.type === 'number') {
      v[item.name] = Number(item.initial);
    } else {
      const s = String(item.initial ?? 'no').toLowerCase().trim();
      v[item.name] = (s === 'si' || s === 'sí' || s === 'true') ? 'si' : s;
    }
  });
  return v;
}

function findVarName(raw) {
  const clean = String(raw || '').trim().toLowerCase();
  const found = DATOS_SIMULADOR.variables.find(v => v.name.toLowerCase() === clean);
  return found ? found.name : null;
}

function applyEffects(vars, effectsStr) {
  const next = Object.assign({}, vars);
  if (!effectsStr || effectsStr.trim() === '—' || effectsStr.trim() === '-') return next;
  effectsStr.split(/[;,]/).map(s => s.trim()).filter(Boolean).forEach(part => {
    const assign = part.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*=\s*(.+)$/);
    if (assign) {
      const vn = findVarName(assign[1]);
      const val = assign[2].trim().toLowerCase();
      if (vn) next[vn] = (val === 'si' || val === 'sí' || val === 'true') ? 'si' : val;
      return;
    }
    const delta = part.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*([+\-−])\s*(\d+(\.\d+)?)$/);
    if (delta) {
      const vn = findVarName(delta[1]);
      const sign = delta[2] === '+' ? 1 : -1;
      const num = parseFloat(delta[3]);
      if (vn && typeof next[vn] === 'number') {
        next[vn] = Math.max(0, Math.min(10, next[vn] + sign * num));
      }
    }
  });
  return next;
}

function evalCondition(vars, expr) {
  if (!expr || !expr.trim()) return true;
  const clean = expr.trim().replace(/^(la opción aparece solo si|la opcion aparece solo si|aparece solo si|solo si)\s+/i, '').trim();
  const m = clean.match(/^([a-zA-ZáéíóúÁÉÍÓÚñÑ0-9_]+)\s*(>=|<=|≥|≤|=|>|<|mayor o igual que|menor o igual que|menor que|mayor que)\s*(.+)$/i);
  if (!m) return true;
  const vn = findVarName(m[1]);
  if (!vn) return true;
  const op = m[2].toLowerCase();
  const rhs = m[3].trim().toLowerCase().replace(/\.$/, '');
  const cur = vars[vn];
  if (typeof cur === 'number') {
    const n = parseFloat(rhs);
    if (op === '>=' || op === '≥' || op === 'mayor o igual que') return cur >= n;
    if (op === '<=' || op === '≤' || op === 'menor o igual que') return cur <= n;
    if (op === '>' || op === 'mayor que') return cur > n;
    if (op === '<' || op === 'menor que') return cur < n;
    if (op === '=') return cur === n;
  } else {
    const cNorm = (cur === 'si' || cur === 'sí') ? 'si' : String(cur).toLowerCase();
    const rNorm = (rhs === 'si' || rhs === 'sí') ? 'si' : rhs;
    if (op === '=') return cNorm === rNorm;
  }
  return true;
}

function resolveDest(opt, varsAfter) {
  if (opt.targetCondition) {
    const bm = opt.targetCondition.match(/va a\s+([A-Za-z0-9_]+)\s+si\s+([^;]+);\s*si\s*no,?\s*(?:va a\s*)?([A-Za-z0-9_]+)/i);
    if (bm) return evalCondition(varsAfter, bm[2]) ? bm[1].trim() : bm[3].trim();
  }
  return String(opt.to || '').split(/\s+o\s+/)[0].trim();
}

function escapeHtml(s) {
  return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

function beginWithStudent() {
  const n = document.getElementById('st-name').value.trim();
  const id = document.getElementById('st-id').value.trim();
  const err = document.getElementById('st-err');
  if (!n) {
    err.style.display = 'block';
    err.textContent = 'Por favor ingresá tu Nombre y Apellido para iniciar.';
    return;
  }
  state.studentName = n;
  state.studentId = id;
  state.registered = true;
  render();
}

async function sendResultToSheet() {
  const btn = document.getElementById('btn-sheet-submit');
  if (!btn || state.submitted) return;
  btn.disabled = true;
  btn.textContent = 'Enviando registro a la cátedra...';

  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  const routeCode = state.history.map(h => h.optionId).concat([node ? node.id : '']).join(', ');
  const varsSummary = DATOS_SIMULADOR.variables.map(v => v.name + ': ' + state.vars[v.name]).join(' | ');
  const stepsSummary = state.history.map((h, i) => (i+1) + '. ' + h.optionId + ' (' + h.optionText + ')').join(' -> ');

  const payload = {
    studentName: state.studentName || 'Sin nombre',
    studentId: state.studentId || '-',
    simTitle: DATOS_SIMULADOR.meta.title,
    finalNode: node ? (node.id + ' - ' + node.title) : '',
    routeCode: routeCode,
    finalVars: varsSummary,
    stepsDetail: stepsSummary
  };

  if (DATOS_SIMULADOR.sheetsWebhookUrl) {
    try {
      await fetch(DATOS_SIMULADOR.sheetsWebhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      state.submitted = true;
      btn.textContent = '✓ Recorrido registrado correctamente en la planilla docente';
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Reintentar envío a la planilla';
    }
  } else {
    state.submitted = true;
    btn.textContent = '✓ Finalización confirmada (Copiá tu código abajo)';
  }
}

  const optsHtml = opts.map(o =>
    '<button class="option-btn" onclick="chooseOption(\'' + o.id + '\')">' +
    '<span class="opt-letter">' + escapeHtml(o.label) + '</span>' +
    '<span>' + escapeHtml(o.text) + '</span></button>'
  ).join('');

  screen.innerHTML = visual + '<div class="content">' +
    '<span class="badge badge-decision">Situación · ' + escapeHtml(node.id) + '</span>' +
    '<p class="situation-text">' + escapeHtml(node.text) + '</p>' +
    '<div class="options-list">' + optsHtml + '</div></div>';
}

function chooseOption(optId) {
  const opt = DATOS_SIMULADOR.options.find(o => o.id === optId);
  const node = DATOS_SIMULADOR.nodes.find(n => n.id === state.currentNodeId);
  if (!opt || !node) return;
  state.vars = applyEffects(state.vars, opt.effects);
  const nextId = resolveDest(opt, state.vars);
  state.history.push({ nodeId: node.id, nodeText: node.text, optionId: opt.id, optionText: opt.text });
  if (opt.immediateConsequence && opt.immediateConsequence.trim() !== '—') {
    state.pendingConsequence = { text: opt.immediateConsequence, nextNodeId: nextId };
  } else {
    state.currentNodeId = nextId;
  }
  render();
}

function continueStep() {
  if (state.pendingConsequence) {
    state.currentNodeId = state.pendingConsequence.nextNodeId;
    state.pendingConsequence = null;
    render();
  }
}

function copyCode() {
  const code = document.getElementById('route-code').textContent;
  const t = document.createElement('textarea');
  t.value = code;
  document.body.appendChild(t);
  t.select();
  document.execCommand('copy');
  document.body.removeChild(t);
}

function restartSim() {
  state = {
    registered: state.studentName ? true : (!DATOS_SIMULADOR.requireLogin),
    studentName: state.studentName,
    studentId: state.studentId,
    submitted: false,
    currentNodeId: DATOS_SIMULADOR.nodes[0].id,
    vars: initVars(),
    history: [],
    pendingConsequence: null
  };
  render();
}

state.vars = initVars();
render();
</script>
</body>
</html>
